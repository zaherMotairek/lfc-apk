services:
  postgres:
    image: postgres:16-alpine
    container_name: kop-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kop_platform
    volumes:
      - kop_postgres_data:/var/lib/postgresql/data

volumes:
  kop_postgres_data:
